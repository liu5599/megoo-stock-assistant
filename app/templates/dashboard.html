{% extends "base.html" %}
{% block title %}市场总览 — megoo股票助手{% endblock %}
{% block head %}
<style>
.dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}
@media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
.index-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
}
.index-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
}
.index-card:hover { border-color: var(--accent); }
.index-card .idx-name { font-size: 0.75rem; color: var(--text-muted); }
.index-card .idx-price { font-size: 1.2rem; font-weight: 700; }
.index-card .idx-change { font-size: 0.8rem; }
.heatmap-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
}
.heatmap-cell {
    aspect-ratio: 2.5;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
}
.heatmap-cell:hover { filter: brightness(1.2); }
.breadth-bar {
    height: 8px;
    border-radius: 4px;
    display: flex;
    overflow: hidden;
    margin: 0.5rem 0;
}
.breadth-bar .up-seg { background: #e74c3c; }
.breadth-bar .down-seg { background: #27ae60; }
.breadth-bar .flat-seg { background: #30363d; }
.stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 0.25rem 0;
}
.dash-section { margin-bottom: 1.5rem; }
.dash-section h3 { margin-bottom: 0.5rem; color: var(--text-primary); font-size: 1rem; }
</style>
{% endblock %}

{% block content %}
<h1 style="margin-bottom:1rem;">🏠 市场总览</h1>

<div class="dash-grid">
    <!-- 左列：指数 + 情绪 -->
    <div>
        <!-- 主要指数 -->
        <div class="dash-section card">
            <h3>📈 主要指数</h3>
            <div class="index-cards" id="index-cards">
                <div class="loading-spinner"><div class="spinner"></div>加载中...</div>
            </div>
        </div>

        <!-- 涨跌统计 -->
        <div class="dash-section card">
            <h3>📊 市场情绪</h3>
            <div id="breadth-panel">
                <div class="loading-spinner"><div class="spinner"></div>加载中...</div>
            </div>
        </div>
    </div>

    <!-- 右列：行业热力图 -->
    <div>
        <div class="dash-section card">
            <h3>🔥 行业板块热度 <small style="font-weight:normal;color:var(--text-muted);font-size:0.75em">（点击板块查看该行业股票）</small></h3>
            <div id="sector-heatmap">
                <div class="loading-spinner"><div class="spinner"></div>加载中...</div>
            </div>
        </div>

        <!-- 快捷入口 -->
        <div class="dash-section">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                <a href="/ranking" class="card" style="text-decoration:none;text-align:center;cursor:pointer;display:block;">
                    <div style="font-size:2rem;">📊</div>
                    <div style="color:var(--text-primary);">选股排名</div>
                </a>
                <a href="/compare" class="card" style="text-decoration:none;text-align:center;cursor:pointer;display:block;">
                    <div style="font-size:2rem;">⚖️</div>
                    <div style="color:var(--text-primary);">股票对比</div>
                </a>
                <a href="/backtest" class="card" style="text-decoration:none;text-align:center;cursor:pointer;display:block;">
                    <div style="font-size:2rem;">📈</div>
                    <div style="color:var(--text-primary);">策略回测</div>
                </a>
                <a href="/watchlist" class="card" style="text-decoration:none;text-align:center;cursor:pointer;display:block;">
                    <div style="font-size:2rem;">⭐</div>
                    <div style="color:var(--text-primary);">自选股</div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDashboard() {
    try {
        const resp = await fetch('/api/market/overview');
        const data = await resp.json();
        renderIndices(data.indices || []);
        renderBreadth(data.breadth || {});
        renderSectors(data.sectors || []);
        // 更新时间戳
        const ts = data.timestamp;
        const el = document.getElementById('update-time');
        if (ts && el) el.textContent = new Date(ts).toLocaleTimeString('zh-CN');
    } catch(e) {
        console.error('Dashboard load error:', e);
    }
}

function renderIndices(indices) {
    const container = document.getElementById('index-cards');
    if (!indices.length) {
        container.innerHTML = '<p style="color:var(--text-muted)">暂无数据</p>';
        return;
    }
    container.innerHTML = indices.map(i => {
        const cls = i.change_pct > 0 ? 'up' : i.change_pct < 0 ? 'down' : '';
        const sign = i.change_pct > 0 ? '+' : '';
        return `<div class="index-card" onclick="location.href='/stock/${i.code}'">
            <div class="idx-name">${i.name}</div>
            <div class="idx-price">${i.close.toFixed(0)}</div>
            <div class="idx-change ${cls}">${sign}${i.change_pct.toFixed(2)}%</div>
        </div>`;
    }).join('');
}

function renderBreadth(b) {
    const total = (b.up||0) + (b.down||0) + (b.flat||0);
    if (total === 0) {
        document.getElementById('breadth-panel').innerHTML = '<p style="color:var(--text-muted)">暂无数据</p>';
        return;
    }
    const upPct = (b.up/total*100).toFixed(0);
    const downPct = (b.down/total*100).toFixed(0);
    const flatPct = (b.flat/total*100).toFixed(0);

    document.getElementById('breadth-panel').innerHTML = `
        <div class="stat-row"><span>上涨家数</span><span class="up">${b.up||0}</span></div>
        <div class="stat-row"><span>下跌家数</span><span class="down">${b.down||0}</span></div>
        <div class="stat-row"><span>平盘</span><span style="color:var(--text-muted)">${b.flat||0}</span></div>
        <div class="breadth-bar">
            <div class="up-seg" style="width:${upPct}%"></div>
            <div class="down-seg" style="width:${downPct}%"></div>
            <div class="flat-seg" style="width:${flatPct}%"></div>
        </div>
        <div class="stat-row"><span>涨停 / 跌停</span><span><span class="up">${b.limit_up||0}</span> / <span class="down">${b.limit_down||0}</span></span></div>
        <div class="stat-row"><span>市场热度</span><span>${'🔥'.repeat(Math.round((b.heat||50)/20))} (${b.heat||50})</span></div>
        ${b.estimated ? '<div style="font-size:0.7rem;color:var(--accent);margin-top:4px">⚠️ 该涨跌数据为估算值，非实时行情</div>' : ''}
    `;
}

function renderSectors(sectors) {
    const container = document.getElementById('sector-heatmap');
    if (!sectors.length) {
        container.innerHTML = '<p style="color:var(--text-muted)">暂无数据</p>';
        return;
    }
    const maxChg = Math.max(...sectors.map(s=>Math.abs(s.change_pct)), 0.01);

    container.innerHTML = `<div class="heatmap-grid">` + sectors.map(s => {
        const intensity = Math.min(Math.abs(s.change_pct)/maxChg*0.9 + 0.1, 1);
        const bg = s.change_pct >= 0
            ? `rgba(231,76,60,${intensity})`
            : `rgba(39,174,96,${intensity})`;
        const color = intensity > 0.5 ? '#fff' : 'var(--text-primary)';
        return `<div class="heatmap-cell" style="background:${bg};color:${color};cursor:pointer"
            title="${s.name}: ${s.change_pct>=0?'+':''}${s.change_pct}% | 点击查看行业股票"
            onclick="location.href='/ranking?sector=${encodeURIComponent(s.name)}'">
            ${s.name}
            <small style="display:block;font-size:0.7em">${s.change_pct>=0?'+':''}${s.change_pct}%</small>
        </div>`;
    }).join('') + `</div>`;
}

// Auto-refresh every 60s (with cleanup on navigation)
const dashboardInterval = setInterval(loadDashboard, 60000);
window.addEventListener('beforeunload', () => clearInterval(dashboardInterval));
document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
{% endblock %}
