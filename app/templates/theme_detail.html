{% extends "base.html" %}

{% block title %}🔥 {{ board_name }} 题材成分 - megoo股票助手{% endblock %}

{% block content %}
<style>
    .td-container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card-bg, #fff); border-radius: 12px; padding: 18px; margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f2f3f5; }
    th { color: #999; font-weight: 500; font-size: 12px; }
    .clickable-row { cursor: pointer; transition: background 0.15s; }
    .clickable-row:hover { background: rgba(231,76,60,0.08) !important; }
    .up { color: var(--red-up, #e74c3c); }
    .down { color: var(--green-down, #27ae60); }
    .loading { color: #999; padding: 12px; text-align: center; }
    .btn-back { display: inline-block; padding: 6px 14px; border-radius: 6px; background: #f2f3f5;
                color: #323233; font-size: 13px; text-decoration: none; margin-bottom: 10px; }
</style>

<div class="td-container">
    <a href="/ops" class="btn-back">← 返回操盘台</a>
    <div class="card">
        <div class="card-title">🔥 {{ board_name }} 成分股</div>
        <div id="stocks-area" class="loading">加载中...</div>
    </div>
</div>

<script>
async function loadTheme() {
    const area = document.getElementById('stocks-area');
    try {
        const r = await fetch('/api/ops/theme/' + encodeURIComponent({{ board_name|tojson }}) + '/detail');
        const d = await r.json();
        const stocks = d.stocks || [];
        if (!stocks.length) {
            area.innerHTML = '<div class="loading">暂无成分股数据（数据源受限或涨停池无该题材）</div>';
            return;
        }
        let html = `<table>
            <thead><tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th><th>连板</th><th>封板资金</th></tr></thead><tbody>`;
        stocks.forEach(s => {
            const pct = parseFloat(s.pct_chg);
            html += `<tr class="clickable-row" onclick="location.href='/stock/${esc(s.code)}'" title="点击查看 ${esc(s.name)} 深度分析">
                <td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${s.price ?? '-'}</td>
                <td class="${pct >= 0 ? 'up' : 'down'}">${pct ? fmtPct(pct) : '-'}</td>
                <td>${s.boards ? s.boards + '板' : '-'}</td>
                <td>${s.seal_amount ? (s.seal_amount/1e8).toFixed(2) + '亿' : '-'}</td></tr>`;
        });
        html += '</tbody></table>';
        if (d.source) html += '<div style="font-size:12px;color:#999;margin-top:8px">数据源：' + esc(d.source) + '</div>';
        area.innerHTML = html;
    } catch (e) {
        area.innerHTML = '<div class="loading">加载失败：' + esc(e.message) + '</div>';
    }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPct(v) { const n = parseFloat(v); return (n > 0 ? '+' : '') + n.toFixed(2) + '%'; }
loadTheme();
</script>
{% endblock %}
