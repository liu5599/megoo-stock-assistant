{% extends "base.html" %}
{% block title %}自选股 — megoo股票助手{% endblock %}
{% block head %}
<style>
.wl-controls {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    align-items: flex-end;
}
.wl-add-group {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
    flex: 1;
}
.code-input {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    font-size: 0.9rem;
    width: 250px;
    outline: none;
}
.code-input:focus { border-color: var(--accent); }
.wl-table td { padding: 0.6rem 0.75rem; }
.wl-table .price  { text-align: right; font-variant-numeric: tabular-nums; }
.wl-table .pct   { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.wl-table .code  { cursor: pointer; color: var(--accent); }
.wl-table .code:hover { text-decoration: underline; }
.wl-table .btn-remove {
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.1rem;
    transition: color 0.15s;
}
.wl-table .btn-remove:hover { color: var(--red-up); }
.empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
}
.quick-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
}
.btn-alert { cursor: pointer; color: var(--accent); font-size: 0.85rem; margin-right: 0.5rem; }
.btn-alert:hover { text-decoration: underline; }
.alert-form-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
.alert-form-row select, .alert-form-row input {
    background: var(--bg-primary); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.85rem;
}
.rule-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0;
              border-bottom: 1px dashed var(--border); font-size: 0.85rem; flex-wrap: wrap; }
.rule-item:last-child { border-bottom: none; }
.rule-badge { background: var(--accent-soft, rgba(0,122,255,.12)); color: var(--accent);
              padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
.rule-off { opacity: 0.45; }
</style>
{% endblock %}

{% block content %}
<h1 style="margin-bottom: 1rem;">⭐ 自选股管理</h1>

<!-- 控制栏 -->
<div class="wl-controls">
    <div class="wl-add-group">
        <div style="flex:1">
            <label class="form-label">添加股票（输入代码或名称）</label>
            <input type="text" class="code-input" id="wl-input"
                   placeholder="输入代码如 000001,600519 或名称..."
                   oninput="searchStocks(this.value)" autocomplete="off">
            <div id="wl-search-dropdown" class="search-dropdown"></div>
        </div>
        <button class="btn btn-primary" onclick="addSelected()" id="wl-add-btn">➕ 添加</button>
    </div>
    <div style="display:flex;gap:0.25rem;">
        <button class="btn btn-secondary btn-sm" onclick="exportWL()">📥 导出</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('wl-import').click()">📤 导入</button>
        <input type="file" id="wl-import" accept=".json" style="display:none" onchange="importWL(this)">
    </div>
</div>

<!-- 自选股列表 -->
<div id="wl-content">
    <div class="loading-spinner"><div class="spinner"></div>加载自选股...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
let selectedCode = null;
let selectedName = null;
let debounceTimer;

// ===== 加载自选股 =====
async function loadWatchlist() {
    const container = document.getElementById('wl-content');
    try {
        const resp = await fetch('/api/watchlist');
        const data = await resp.json();

        if (!data.stocks || data.stocks.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <p style="font-size:3rem;">⭐</p>
                    <p>自选股列表为空</p>
                    <p style="font-size:0.8rem;">在上方输入框搜索并添加你关注的股票</p>
                </div>`;
            return;
        }

        let html = `<div class="card"><table class="data-table wl-table">
            <thead><tr>
                <th>代码</th><th>名称</th><th style="text-align:right">最新价</th>
                <th style="text-align:right">涨跌幅</th><th style="text-align:right">昨收</th><th>操作</th>
            </tr></thead><tbody>`;

        data.stocks.forEach(s => {
            const q = s.quote || {};
            const price = q.price != null ? q.price.toFixed(2) : '--';
            const pct = q.change_pct != null ? q.change_pct.toFixed(2) + '%' : '--';
            const pre = q.pre_close != null ? q.pre_close.toFixed(2) : '--';
            const pctClass = q.change_pct != null ? (q.change_pct >= 0 ? 'up' : 'down') : '';

            html += `<tr>
                <td class="code" onclick="location.href='/stock/${s.code}'">${s.code}</td>
                <td>${s.name || '-'}</td>
                <td class="price">${price}</td>
                <td class="pct ${pctClass}">${pct}</td>
                <td class="price">${pre}</td>
                <td>
                    <span class="btn-alert" onclick="openAlertForm('${s.code}','${s.name}')">🔔 设预警</span>
                    <span class="btn-remove" onclick="removeFromWL('${s.code}')" title="移除">✕</span>
                </td>
            </tr>`;
        });

        html += `</tbody></table></div>`;

        // 快捷操作
        html += `<div class="quick-actions">
            <span style="color:var(--text-muted);font-size:0.8rem;">共 ${data.count} 只</span>
            <button class="btn btn-secondary btn-sm" onclick="location.href='/ranking'">📊 去排名</button>
        </div>`;

        // 预警规则管理卡片
        html += `<div class="card" style="margin-top:1rem;">
            <div class="card-title">🔔 股价预警规则 <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(命中后 PushPlus 微信推送，同规则冷却30分钟)</span></div>
            <div id="alert-rules-list">加载中...</div>
            <div style="margin-top:0.8rem;font-size:0.8rem;color:var(--text-muted)">
                交易时段(9:15-15:05)每分钟自动检查自选股；手动检查：<button class="btn btn-secondary btn-sm" onclick="manualCheck()">▶ 立即检查一次</button>
            </div>
        </div>`;

        container.innerHTML = html;
        loadAlertRules();
    } catch(e) {
        container.innerHTML = `<div class="card" style="color:var(--red-up)">❌ 加载失败: ${e.message}</div>`;
    }
}

// ===== 搜索 =====
async function searchStocks(val) {
    clearTimeout(debounceTimer);
    const dropdown = document.getElementById('wl-search-dropdown');
    if (val.length < 2) {
        dropdown.classList.remove('show');
        return;
    }
    debounceTimer = setTimeout(async () => {
        try {
            const resp = await fetch(`${window.SEARCH_API_URL}?q=${encodeURIComponent(val)}`);
            const data = await resp.json();
            if (data.stocks && data.stocks.length > 0) {
                dropdown.innerHTML = data.stocks.map(s =>
                    `<div class="search-result-item" onclick="selectStock('${s.code}','${s.name}')">
                        <span><span class="code">${s.code}</span> ${s.name}</span>
                        <span style="color:var(--text-muted)">${s.sector||''}</span>
                    </div>`
                ).join('');
                dropdown.classList.add('show');
            } else {
                dropdown.innerHTML = '<div class="search-result-item" style="color:var(--text-muted)">未找到</div>';
                dropdown.classList.add('show');
            }
        } catch(e) {}
    }, 300);
}

function selectStock(code, name) {
    selectedCode = code;
    selectedName = name;
    document.getElementById('wl-input').value = `${code} ${name}`;
    document.getElementById('wl-search-dropdown').classList.remove('show');
}

// ===== 添加/移除 =====
async function addSelected() {
    const input = document.getElementById('wl-input');
    let code = selectedCode;
    let name = selectedName;
    if (!code) {
        // 尝试从输入提取代码
        const match = input.value.match(/(\d{6})/);
        if (!match) { alert('请先搜索并选择一只股票'); return; }
        code = match[1];
    }

    try {
        // 将名称一同传给后端，避免后端重新查询失败
        const params = new URLSearchParams();
        params.set('codes', code);
        if (name) params.set('names', name);
        const resp = await fetch(`/api/watchlist/add?${params.toString()}`, { method: 'POST' });
        const data = await resp.json();
        input.value = '';
        selectedCode = null;
        selectedName = null;
        document.getElementById('wl-search-dropdown').classList.remove('show');
        loadWatchlist();
    } catch(e) {
        alert('添加失败: ' + e.message);
    }
}

async function removeFromWL(code) {
    if (!confirm(`确定要移除 ${code} 吗？`)) return;
    try {
        await fetch(`/api/watchlist/remove?codes=${code}`, { method: 'POST' });
        loadWatchlist();
    } catch(e) {
        alert('移除失败: ' + e.message);
    }
}

// ===== 导入/导出 =====
async function exportWL() {
    window.location.href = '/api/watchlist/export';
}

async function importWL(input) {
    const file = input.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    try {
        const resp = await fetch('/api/watchlist/import', { method: 'POST', body: form });
        const data = await resp.json();
        loadWatchlist();
    } catch(e) {
        alert('导入失败: ' + e.message);
    }
}

// ===== 回车添加 =====
document.addEventListener('keydown', function(e) {
    const input = document.getElementById('wl-input');
    if (e.target === input && e.key === 'Enter') {
        e.preventDefault();
        addSelected();
    }
});

// ===== 股价预警 =====
const RULE_TYPE_LABELS = {
    'price_above': '现价 ≥ 目标价(元)', 'price_below': '现价 ≤ 目标价(元)',
    'pct_above': '涨跌幅 ≥ X(%)', 'pct_below': '涨跌幅 ≤ X(%)',
    'amount_above': '成交额 ≥ X(亿)', 'turnover_above': '换手率 ≥ X(%)',
    'amplitude_above': '振幅 ≥ X(%)', 'high_above': '最高价 ≥ 目标价(元)'
};
let alertFormCode = null;
let alertFormName = null;

async function loadAlertRules() {
    const box = document.getElementById('alert-rules-list');
    try {
        const resp = await fetch('/api/alerts/rules');
        const data = await resp.json();
        const rules = data.rules || [];
        if (rules.length === 0) {
            box.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">暂无规则 — 点击每行的「🔔 设预警」添加</div>';
            return;
        }
        box.innerHTML = rules.map(r => `
            <div class="rule-item ${r.enabled ? '' : 'rule-off'}">
                <span><b>${r.code}</b> ${r.name || ''}</span>
                <span class="rule-badge">${RULE_TYPE_LABELS[r.type] || r.type} ${r.value}</span>
                <span style="margin-left:auto;display:flex;gap:0.4rem;align-items:center;">
                    <button class="btn btn-secondary btn-sm" onclick="toggleAlertRule('${r.code}','${r.type}',${r.value},${!r.enabled})">${r.enabled ? '⏸ 停用' : '▶ 启用'}</button>
                    <button class="btn btn-secondary btn-sm" style="color:var(--red-up)" onclick="deleteAlertRule('${r.code}','${r.type}',${r.value})">🗑 删除</button>
                </span>
            </div>`).join('');
    } catch(e) {
        box.innerHTML = '<div style="color:var(--red-up);font-size:0.85rem;">加载规则失败: ' + e.message + '</div>';
    }
}

function openAlertForm(code, name) {
    alertFormCode = code;
    alertFormName = name;
    const type = prompt('为 ' + code + ' ' + name + ' 设置预警\n选择类型:\n1=现价≥目标(元)  2=现价≤目标(元)  3=涨跌幅≥X(%)  4=涨跌幅≤X(%)\n5=成交额≥X(亿)  6=换手率≥X(%)  7=振幅≥X(%)  8=最高价≥目标(元)');
    const typeMap = {'1':'price_above','2':'price_below','3':'pct_above','4':'pct_below','5':'amount_above','6':'turnover_above','7':'amplitude_above','8':'high_above'};
    const ruleType = typeMap[type || ''];
    if (!ruleType) { toast('已取消或类型无效 ❌', false); return; }
    const val = prompt('输入阈值（' + RULE_TYPE_LABELS[ruleType] + '）：');
    const num = parseFloat(val);
    if (!(num > 0)) { toast('阈值无效 ❌', false); return; }
    addAlertRule(code, name, ruleType, num);
}

async function addAlertRule(code, name, ruleType, value) {
    const params = new URLSearchParams({code, name, rule_type: ruleType, value});
    try {
        const resp = await fetch('/api/alerts/rules?' + params.toString(), {method: 'POST'});
        const data = await resp.json();
        if (data.ok) { toast('预警已添加 ✅'); loadAlertRules(); }
        else { toast('添加失败: ' + (data.detail || '') + ' ❌', false); }
    } catch(e) { toast('添加失败 ❌', false); }
}

async function toggleAlertRule(code, ruleType, value, enabled) {
    const params = new URLSearchParams({code, rule_type: ruleType, value, enabled: String(enabled)});
    try {
        await fetch('/api/alerts/rules/toggle?' + params.toString(), {method: 'POST'});
        toast('已' + (enabled ? '启用' : '停用') + ' ✅');
        loadAlertRules();
    } catch(e) { toast('操作失败 ❌', false); }
}

async function deleteAlertRule(code, ruleType, value) {
    if (!confirm(`删除规则: ${code} ${RULE_TYPE_LABELS[ruleType]} ${value}？`)) return;
    const params = new URLSearchParams({code, rule_type: ruleType, value});
    try {
        const resp = await fetch('/api/alerts/rules?' + params.toString(), {method: 'DELETE'});
        const data = await resp.json();
        if (data.ok) { toast('规则已删除 ✅'); loadAlertRules(); }
        else { toast('删除失败 ❌', false); }
    } catch(e) { toast('删除失败 ❌', false); }
}

async function manualCheck() {
    try {
        const resp = await fetch('/api/alerts/check', {method: 'POST'});
        const data = await resp.json();
        if (data.ok) {
            if (data.hits.length === 0) { toast('检查完成，未命中规则 ✅'); }
            else { toast(`命中 ${data.hits.length} 条预警，已推送 ✅`); loadAlertRules(); }
        } else { toast('检查失败 ❌', false); }
    } catch(e) { toast('检查失败(行情源可能未响应) ❌', false); }
}

// ===== 页面初始化 =====
document.addEventListener('DOMContentLoaded', loadWatchlist);
</script>
{% endblock %}
