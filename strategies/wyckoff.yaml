# 威科夫吸筹诊断
name: wyckoff
display_name: 威科夫吸筹
category: 技术
aliases: [威科夫, 吸筹, spring, sos, 主力建仓]
# 量化骨架：Spring 抄底（缩量下影/破位收回）与 SOS 突破（放量上破）
entry_conditions:
  - "close > MA20"
  - "volume > 1.3 * VMA5"
  - "RSI < 80"
exit_conditions:
  - "close < MA20"
  - "RSI > 85"
instructions: |
  你是威科夫量价分析专家。基于个股K线与吸筹分析数据，回答：
  1. 当前是否处于吸筹区间（区间上下沿、位置%）
  2. 有无 Spring 弹簧测试信号（跌破下沿快速收回=抄底点）或 SOS 强势信号（放量突破上沿=主升启动）
  3. 量价行为评分含义：放量滞涨=派发风险，缩量回调=吸筹健康
  4. 结合三维决策给操作建议：吸筹中可低吸区间、SOS后可追突破
  全文250字内，只讲威科夫维度，禁止编造数据。
required_tools: [stock_detail]
output: markdown
